<svg
  width="512"
  height="512"
  viewBox="60 60 392 394"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Основные градиенты -->
    <linearGradient id="leftFace" x1="120" y1="150" x2="270" y2="390">
      <stop offset="0" stop-color="#AEFB2A"/>
      <stop offset="0.45" stop-color="#50E66C"/>
      <stop offset="1" stop-color="#00CFA8"/>
    </linearGradient>

    <linearGradient id="rightFace" x1="270" y1="150" x2="420" y2="390">
      <stop offset="0" stop-color="#37E9A0"/>
      <stop offset="0.5" stop-color="#00D7B3"/>
      <stop offset="1" stop-color="#00AFC0"/>
    </linearGradient>

    <linearGradient id="topFace" x1="150" y1="100" x2="360" y2="210">
      <stop offset="0" stop-color="#C7FF55"/>
      <stop offset="0.45" stop-color="#6CF58B"/>
      <stop offset="1" stop-color="#18DDB5"/>
    </linearGradient>

    <!-- Внутренний градиент -->
    <linearGradient id="inner" x1="180" y1="190" x2="350" y2="350">
      <stop offset="0" stop-color="#0B8F65" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#003E3B" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Блик -->
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="white" stop-opacity="0.15"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Свечение -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- Маски для граней -->
    <clipPath id="leftClip">
      <path d="M256 92L256 256L112 338L112 174Z"/>
    </clipPath>

    <clipPath id="rightClip">
      <path d="M256 92L400 174L400 338L256 420Z"/>
    </clipPath>

    <clipPath id="topClip">
      <path d="M256 92L400 174L256 256L112 174Z"/>
    </clipPath>
  </defs>

  <!-- Мягкое свечение вокруг куба -->
  <path
    d="M256 70L420 164V350L256 444L92 350V164L256 70Z"
    fill="#AEFB2A"
    opacity="0.16"
    filter="url(#softGlow)"
  />

  <!-- ЛЕВАЯ ГРАНЬ -->
  <path
    d="M256 92L256 256L112 338L112 174Z"
    fill="url(#leftFace)"
    fill-opacity="0.82"
  />

  <!-- Внутренние преломления слева -->
  <g clip-path="url(#leftClip)">
    <path
      d="M100 130L220 330L270 300L150 100Z"
      fill="white"
      opacity="0.12"
    />

    <path
      d="M135 140L250 270L250 300L120 210Z"
      fill="#D8FF83"
      opacity="0.18"
    />

    <path
      d="M170 90L260 210L260 250L185 150Z"
      fill="url(#highlight)"
      opacity="0.5"
    />
  </g>

  <!-- ПРАВАЯ ГРАНЬ -->
  <path
    d="M256 92L400 174L400 338L256 420Z"
    fill="url(#rightFace)"
    fill-opacity="0.78"
  />

  <!-- Внутренние преломления справа -->
  <g clip-path="url(#rightClip)">
    <path
      d="M280 100L410 190L410 250L280 170Z"
      fill="white"
      opacity="0.13"
    />

    <path
      d="M300 160L420 280L420 330L270 220Z"
      fill="#A8FFF0"
      opacity="0.14"
    />

    <path
      d="M350 120L400 150L400 330L350 300Z"
      fill="#00FFE0"
      opacity="0.13"
    />
  </g>

  <!-- ВЕРХНЯЯ ГРАНЬ -->
  <path
    d="M256 92L400 174L256 256L112 174Z"
    fill="url(#topFace)"
    fill-opacity="0.72"
  />

  <g clip-path="url(#topClip)">
    <path
      d="M100 120L240 230L300 190L170 80Z"
      fill="white"
      opacity="0.14"
    />

    <path
      d="M250 70L420 160L380 190L230 100Z"
      fill="#00FFD0"
      opacity="0.16"
    />

    <path
      d="M140 140L250 220L370 150L255 100Z"
      fill="url(#highlight)"
      opacity="0.45"
    />
  </g>

  <!-- ВНУТРЕННИЙ ОБЪЁМ -->
  <path
    d="M256 150L348 203L256 256L164 203Z"
    fill="url(#inner)"
    opacity="0.55"
  />

  <!-- Центральное внутреннее ребро -->
  <path
    d="M256 92V256L112 338"
    stroke="#D8FF91"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.8"
    filter="url(#glow)"
  />

  <path
    d="M256 256L400 338"
    stroke="#8FFFF0"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.75"
    filter="url(#glow)"
  />

  <!-- Внешний контур -->
  <path
    d="M256 92L400 174V338L256 420L112 338V174L256 92Z"
    stroke="#AEFB2A"
    stroke-width="3"
    stroke-linejoin="round"
    opacity="0.9"
    filter="url(#glow)"
  />

  <!-- Верхний контур -->
  <path
    d="M112 174L256 256L400 174"
    stroke="#D8FF9A"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.7"
  />

  <!-- Блики на рёбрах -->
  <path
    d="M256 92L400 174"
    stroke="white"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.42"
  />

  <path
    d="M112 174L256 92"
    stroke="white"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.35"
  />

  <path
    d="M256 256L256 420"
    stroke="#CFFFF2"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.45"
  />

</svg>